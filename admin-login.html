<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login - FlavorHub</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff7a18, #ffb347);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 400px;
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #ff6b00;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    border: none;
    border-radius: 8px;
    background: #ff6b00;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #e85d00;
}

.demo {
    margin-top: 20px;
    padding: 12px;
    background: #fff3e8;
    border-radius: 8px;
    font-size: 14px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #ff6b00;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>👨‍💼 Admin Login</h1>
    <p class="subtitle">FlavorHub Administration</p>

    <form onsubmit="adminLogin(event)">

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login as Admin</button>

    </form>

    <div class="demo">
        <b>Demo Login</b><br>
        Email: admin@flavorhub.com<br>
        Password: admin123
    </div>

    <a href="login.html" class="back">← Back to User Login</a>

</div>

<script>

function adminLogin(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (
        email === "admin@flavorhub.com" &&
        password === "admin123"
    ) {

        localStorage.setItem("flavorHubAdminLoggedIn", "true");

        alert("Admin login successful!");

        window.location.href = "admin-dashboard.html";

    } else {

        alert("Incorrect admin email or password.");

    }
}

</script>

</body>
</html>
