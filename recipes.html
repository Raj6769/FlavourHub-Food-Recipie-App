<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipes - FlavorHub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fffaf5;
    color:#333;
}

.navbar{
    background:white;
    height:70px;
    padding:0 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    font-size:26px;
    font-weight:bold;
    color:#e85d04;
}

nav{
    display:flex;
    gap:25px;
    align-items:center;
}

nav a{
    text-decoration:none;
    color:#333;
}

nav a:hover{
    color:#e85d04;
}

.page-header{
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(120deg,#fff1e6,#ffe8cc);
}

.page-header h1{
    font-size:45px;
    margin-bottom:15px;
}

.page-header p{
    color:#666;
    font-size:18px;
}

.container{
    width:84%;
    margin:50px auto;
}

.recipe-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.recipe-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.recipe-card:hover{
    transform:translateY(-5px);
}

.recipe-image{
    height:190px;
    background:#ffe8cc;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:75px;
}

.recipe-info{
    padding:20px;
}

.category{
    color:#e85d04;
    background:#fff0e0;
    padding:5px 10px;
    border-radius:15px;
    font-size:13px;
}

.recipe-info h3{
    margin:15px 0 10px;
}

.recipe-info p{
    color:#666;
    line-height:1.5;
    min-height:48px;
}

.details{
    margin:15px 0;
    color:#777;
    font-size:14px;
}

.view-btn{
    display:block;
    text-align:center;
    background:#e85d04;
    color:white;
    padding:11px;
    border-radius:7px;
    text-decoration:none;
}

.view-btn:hover{
    background:#c94d00;
}

@media(max-width:1000px){
    .recipe-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .navbar{
        height:auto;
        padding:20px;
        flex-direction:column;
        gap:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .recipe-grid{
        grid-template-columns:1fr;
    }

    .page-header h1{
        font-size:35px;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">🍴 FlavorHub</div>

    <nav>
        <a href="home.html">Home</a>
        <a href="recipes.html">Recipes</a>
        <a href="search.html">Search</a>
        <a href="favorites.html">Favorites</a>
        <a href="index.html">Logout</a>
    </nav>

</header>


<section class="page-header">

    <h1>Explore Our Recipes 🍽️</h1>

    <p>
        Discover delicious dishes from different cuisines.
    </p>

</section>


<div class="container">

    <div class="recipe-grid" id="recipeGrid"></div>

</div>


<script>

{

];


const grid =
document.getElementById("recipeGrid");


recipes.forEach(recipe => {

    grid.innerHTML += `

        <div class="recipe-card">

            <div class="recipe-image">
                ${recipe.icon}
            </div>

            <div class="recipe-info">

                <span class="category">
                    ${recipe.cuisine}
                </span>

                <h3>
                    ${recipe.name}
                </h3>

                <p>
                    ${recipe.description}
                </p>

                <div class="details">
                    ⏱ ${recipe.time}
                    &nbsp;&nbsp;
                    ⭐ ${recipe.rating}
                </div>

                <a
                    class="view-btn"
                    href="recipe.html?id=${recipe.id}"

                    View Recipe

        </div>

    `;

});

</script>

</body>
</html>
