<!DOCTYPE html>
<html>
<head>
    <title>FlavorHub - Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff7a18, #ffb347);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #ff6b00;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #e85d00;
        }

        p {
            text-align: center;
        }

        a {
            color: #ff6b00;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🍴 FlavorHub</h1>
    <h2>Create Account</h2>

    <form id="signupForm">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="email" id="email" placeholder="Email" required>

        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Sign Up</button>

    </form>

    <p>Already have an account?</p>
    <p><a href="login.html">Login here</a></p>
</div>

<script>

document.getElementById("signupForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const user = {
        name: name,
        email: email,
        password: password
    };

    // Save user
    localStorage.setItem("flavorHubUser", JSON.stringify(user));

    // Also save in users list for Admin
    let users = JSON.parse(localStorage.getItem("flavorHubUsers")) || [];

    users = users.filter(u => u.email !== email);
    users.push(user);

    localStorage.setItem("flavorHubUsers", JSON.stringify(users));

    alert("Signup successful! Please login.");

    window.location.href = "login.html";

});

</script>

</body>
</html>
