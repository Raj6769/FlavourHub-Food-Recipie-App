<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - FlavorHub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #ff6b00;
    color: white;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
}

.logout {
    background: white;
    color: #ff6b00;
    border: none;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

h2 {
    margin-bottom: 25px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.card h3 {
    font-size: 35px;
    color: #ff6b00;
    margin: 10px;
}

.menu {
    margin-top: 35px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.menu a {
    background: #ff6b00;
    color: white;
    padding: 15px 25px;
    text-decoration: none;
    border-radius: 8px;
}

.menu a:hover {
    background: #e85d00;
}

@media(max-width: 800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>

    <h1>🍴 FlavorHub Admin</h1>

    <button class="logout" onclick="logout()">Logout</button>

</header>

<div class="container">

    <h2>📊 Admin Dashboard</h2>

    <div class="stats">

        <div class="card">
            <h3 id="recipeCount">0</h3>
            <p>Submitted Recipes</p>
        </div>

        <div class="card">
            <h3 id="pendingCount">0</h3>
            <p>Pending Recipes</p>
        </div>

        <div class="card">
            <h3 id="userCount">0</h3>
            <p>Registered Users</p>
        </div>

        <div class="card">
            <h3 id="favoriteCount">0</h3>
            <p>Favorites</p>
        </div>

    </div>

    <div class="menu">

        <a href="manage-recipes.html">
            🍲 Manage Recipes
        </a>

        <a href="manage-users.html">
            👥 Manage Users
        </a>

        <a href="recipes.html">
            📖 View Recipes
        </a>

        <a href="home.html">
            🏠 User Home
        </a>

    </div>

</div>

<script>

function loadDashboard() {

    const recipes =
        JSON.parse(localStorage.getItem("submittedRecipes")) || [];

    const users =
        JSON.parse(localStorage.getItem("flavorHubUsers")) || [];

    const favoriteRecipes =
        JSON.parse(localStorage.getItem("favoriteRecipes")) || [];

    const pending =
        recipes.filter(recipe => recipe.status === "Pending");

    document.getElementById("recipeCount").textContent =
        recipes.length;

    document.getElementById("pendingCount").textContent =
        pending.length;

    document.getElementById("userCount").textContent =
        users.length;

    document.getElementById("favoriteCount").textContent =
        favoriteRecipes.length;
}

function logout() {

    localStorage.removeItem("flavorHubAdminLoggedIn");

    window.location.href = "admin-login.html";
}

loadDashboard();

</script>

</body>
</html>
